name: mzd-dashboard

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: mzd_dashboard
      POSTGRES_USER: ${DATABASE_USERNAME:-dashboard}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-dashboard}
    ports:
      - "127.0.0.1:${DATABASE_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d mzd_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp rabbitmq_prometheus && rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-dashboard}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dashboard}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:61613:61613"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    command: start-dev --import-realm
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:18080}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-18080}:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/mzd-dashboard-realm.json:ro

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/mzd_dashboard
      DATABASE_USERNAME: ${DATABASE_USERNAME:-dashboard}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-dashboard}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-dashboard}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dashboard}
      APP_STREAMING_BROKER_RELAY_ENABLED: ${APP_STREAMING_BROKER_RELAY_ENABLED:-true}
      APP_STREAMING_BROKER_RELAY_HOST: rabbitmq
      APP_STREAMING_BROKER_RELAY_PORT: 61613
      APP_STREAMING_BROKER_RELAY_CLIENT_LOGIN: ${RABBITMQ_USERNAME:-dashboard}
      APP_STREAMING_BROKER_RELAY_CLIENT_PASSCODE: ${RABBITMQ_PASSWORD:-dashboard}
      APP_STREAMING_BROKER_RELAY_SYSTEM_LOGIN: ${RABBITMQ_USERNAME:-dashboard}
      APP_STREAMING_BROKER_RELAY_SYSTEM_PASSCODE: ${RABBITMQ_PASSWORD:-dashboard}
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED:-true}
      APP_SIMULATION_SCHEDULER_ENABLED: ${APP_SIMULATION_SCHEDULER_ENABLED:-false}
      APP_SIMULATION_OPERATIONAL_SEED_ENABLED: ${APP_SIMULATION_OPERATIONAL_SEED_ENABLED:-false}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:18080/realms/mzd-dashboard}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://keycloak:8080/realms/mzd-dashboard/protocol/openid-connect/certs}
      OIDC_AUDIENCES: ${OIDC_AUDIENCES:-}
      APP_CORS_ALLOWED_ORIGIN_1: http://localhost:5173
      APP_CORS_ALLOWED_ORIGIN_2: http://127.0.0.1:5173
      JAVA_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-true}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-http://localhost:18080/realms/mzd-dashboard}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-mzd-dashboard-spa}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email}
        VITE_OIDC_AUDIENCE: ${VITE_OIDC_AUDIENCE:-}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-}
        VITE_OIDC_SILENT_REDIRECT_URI: ${VITE_OIDC_SILENT_REDIRECT_URI:-}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${VITE_OIDC_POST_LOGOUT_REDIRECT_URI:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"

  train-generator:
    build:
      context: .
      dockerfile: infra/docker/generator-service/Dockerfile
      args:
        SERVICE_MODULE: mzhd-train-generator
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-dashboard}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dashboard}
      TRAIN_GENERATOR_SOURCE_SYSTEM: ${TRAIN_GENERATOR_SOURCE_SYSTEM:-mzhd-train-generator}
      TRAIN_GENERATOR_TICK_INTERVAL: ${TRAIN_GENERATOR_TICK_INTERVAL:-15s}

  event-generator:
    build:
      context: .
      dockerfile: infra/docker/generator-service/Dockerfile
      args:
        SERVICE_MODULE: mzhd-event-generator
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-dashboard}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dashboard}
      EVENT_GENERATOR_SOURCE_SYSTEM: ${EVENT_GENERATOR_SOURCE_SYSTEM:-mzhd-event-generator}
      EVENT_GENERATOR_TICK_INTERVAL: ${EVENT_GENERATOR_TICK_INTERVAL:-45s}
      EVENT_GENERATOR_MAX_ACTIVE: ${EVENT_GENERATOR_MAX_ACTIVE:-6}

  personnel-generator:
    build:
      context: .
      dockerfile: infra/docker/generator-service/Dockerfile
      args:
        SERVICE_MODULE: mzhd-personnel-generator
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-dashboard}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dashboard}
      PERSONNEL_GENERATOR_SOURCE_SYSTEM: ${PERSONNEL_GENERATOR_SOURCE_SYSTEM:-mzhd-personnel-generator}
      PERSONNEL_GENERATOR_TICK_INTERVAL: ${PERSONNEL_GENERATOR_TICK_INTERVAL:-6h}

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: backend
    metrics_path: /actuator/prometheus
    oauth2:
      client_id: prometheus
      client_secret: prometheus-secret
      token_url: http://keycloak:8080/realms/mzd-dashboard/protocol/openid-connect/token
    static_configs:
      - targets:
          - backend:8080

  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq:15692
